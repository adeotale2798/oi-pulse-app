<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StrikLenz motion film renderer</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #07131d; color: #e7f2f7; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(100%, 1120px); }
      canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border: 1px solid #1c3442; border-radius: 16px; background: #07131d; }
      video { display: block; width: 100%; margin-top: 16px; border: 1px solid #1c3442; border-radius: 16px; background: #07131d; }
      video[hidden] { display: none; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; color: #a9bdc8; font-size: 14px; }
      button { border: 0; border-radius: 999px; padding: 11px 18px; background: #0caf82; color: #041a18; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { min-height: 1.25em; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="film" width="1280" height="720" aria-label="StrikLenz motion film preview"></canvas>
      <video id="rendered-film" controls playsinline hidden aria-label="Rendered StrikLenz motion film preview"></video>
      <div class="toolbar">
        <span id="status">24-second StrikLenz product film · illustrative visuals, no live market values</span>
        <button id="render" type="button">Render video and poster</button>
      </div>
    </main>
    <script src="/vendor/mp4-muxer.js"></script>
    <script>
      // The short, timed beat structure follows the NullMotion workflow; all artwork and copy here are original.
      const canvas = document.getElementById("film");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");
      const renderButton = document.getElementById("render");
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const DURATION = 24;
      const SCENE_LENGTH = DURATION / 5;
      const scenes = [
        {
          kicker: "INDIA'S INDEX OPTIONS DESK",
          title: ["See the", "structure", "behind the move."],
          detail: "Open interest, strike activity and market context — brought into one clear view.",
          badge: "NIFTY  ·  BANKNIFTY  ·  SENSEX",
        },
        {
          kicker: "BASIC  /  SHARED MARKET FEED",
          title: ["Start with the", "shared OI desk."],
          detail: "Read OI Change, the option chain, Straddle, events and index risk. No broker connection needed.",
          badge: "ONE PUBLISHER FEED  ·  THREE INDEX DESKS",
        },
        {
          kicker: "PREMIUM  /  PERSONAL ALERTS",
          title: ["Notice when", "the picture shifts."],
          detail: "Add personal OI and event alerts, Market Intel and Global Markets — while the shared OI feed stays the same.",
          badge: "OI CHANGE  ·  OI SHIFT  ·  EVENT ALERTS",
        },
        {
          kicker: "PRO  /  YOUR PRIVATE WORKSPACE",
          title: ["Your broker.", "Your positions.", "Your journal."],
          detail: "Connect your own broker for private Positions, a journal, a neutral risk summary and market-context Desk AI.",
          badge: "DESK AI USES MARKET CONTEXT, NOT YOUR POSITIONS",
        },
        {
          kicker: "THREE WAYS INTO ONE CLEARER DESK",
          title: ["Start simple.", "Go deeper when", "you're ready."],
          detail: "Basic for the shared desk. Premium for personal alerts and context. Pro for your private workspace.",
          badge: "STRIKLENZ  ·  BUILT FOR INDIAN INDEX OPTIONS",
        },
      ];

      function roundedRect(x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      function text(value, x, y, size, color, weight = 500, tracking = 0) {
        ctx.font = `${weight} ${size}px Arial, sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        if (!tracking) {
          ctx.fillText(value, x, y);
          return;
        }
        let cursor = x;
        for (const character of value) {
          ctx.fillText(character, cursor, y);
          cursor += ctx.measureText(character).width + tracking;
        }
      }

      function drawBackground(time) {
        const base = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
        base.addColorStop(0, "#07131d");
        base.addColorStop(0.58, "#0b1c28");
        base.addColorStop(1, "#101c32");
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const glow = ctx.createRadialGradient(1010 + Math.sin(time * 0.3) * 55, 190, 15, 1010, 220, 520);
        glow.addColorStop(0, "rgba(10, 177, 129, 0.18)");
        glow.addColorStop(1, "rgba(10, 177, 129, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.strokeStyle = "rgba(169, 197, 211, 0.055)";
        ctx.lineWidth = 1;
        for (let x = 56; x < WIDTH; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, HEIGHT);
          ctx.stroke();
        }
        for (let y = 24; y < HEIGHT; y += 48) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }

        for (let i = 0; i < 34; i += 1) {
          const x = (i * 193.7 + 40) % WIDTH;
          const y = (i * 91.3 + Math.sin(time * 0.45 + i) * 14 + 30) % HEIGHT;
          ctx.fillStyle = `rgba(186, 218, 228, ${0.08 + ((i % 5) * 0.025)})`;
          ctx.fillRect(x, y, 2, 2);
        }
      }

      function drawHeader(sceneIndex, time) {
        // Keep the film mark aligned with the waveform logo used by the app and landing header.
        ctx.save();
        ctx.translate(48, 34);
        ctx.scale(0.75, 0.75);
        const logoGradient = ctx.createLinearGradient(0, 0, 48, 48);
        logoGradient.addColorStop(0, "#10B981");
        logoGradient.addColorStop(0.55, "#059669");
        logoGradient.addColorStop(1, "#0EA5E9");
        roundedRect(1, 1, 46, 46, 9.5, logoGradient, "#FFFFFF");
        ctx.beginPath();
        ctx.moveTo(3.3, 24);
        ctx.lineTo(12, 24);
        ctx.lineTo(16, 24);
        ctx.lineTo(20, 10);
        ctx.lineTo(24, 38);
        ctx.lineTo(28, 18);
        ctx.lineTo(32, 24);
        ctx.lineTo(42, 24);
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 2.75;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(43, 24, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.restore();
        text("StrikLenz", 96, 59, 24, "#e8f4f7", 700);
        text("OPEN-INTEREST MARKET INTELLIGENCE", 251, 57, 11, "#8da8b5", 600, 1.6);

        roundedRect(1000, 36, 232, 34, 17, "rgba(8, 24, 34, 0.9)", "rgba(150, 185, 199, 0.24)");
        ctx.fillStyle = "#21d2a0";
        ctx.beginPath();
        ctx.arc(1019, 53, 4, 0, Math.PI * 2);
        ctx.fill();
        text("ILLUSTRATIVE UI  ·  NO LIVE VALUES", 1032, 57, 9, "#b8cbd3", 700, 0.65);

        ctx.strokeStyle = "rgba(168, 193, 205, 0.22)";
        ctx.beginPath();
        ctx.moveTo(48, 94);
        ctx.lineTo(1232, 94);
        ctx.stroke();

        text(`0${sceneIndex + 1}  /  05`, 1154, 681, 11, "#b6c8d0", 700, 1.1);
        roundedRect(48, 683, 1068, 3, 2, "rgba(174, 196, 207, 0.17)");
        roundedRect(48, 683, 1068 * Math.min(1, time / DURATION), 3, 2, "#16c997");
      }

      function drawChart(x, y, width, height, time, variant = 0) {
        roundedRect(x, y, width, height, 18, "rgba(8, 22, 32, 0.88)", "rgba(162, 193, 205, 0.2)");
        text(variant === 2 ? "PERSONAL ALERTS" : "OPEN INTEREST  /  SAMPLE VIEW", x + 24, y + 34, 10, "#9ab0bb", 700, 1.1);
        text(variant === 2 ? "OI CHANGE  ·  OI SHIFT" : "CALL OI  vs  PUT OI", x + 24, y + 62, 18, "#e6f1f5", 700);

        const plotX = x + 24;
        const plotY = y + 95;
        const plotW = width - 48;
        const plotH = height - 132;
        ctx.strokeStyle = "rgba(168, 193, 205, 0.12)";
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i += 1) {
          const lineY = plotY + (plotH * i) / 3;
          ctx.beginPath();
          ctx.moveTo(plotX, lineY);
          ctx.lineTo(plotX + plotW, lineY);
          ctx.stroke();
        }

        const values = [0.64, 0.54, 0.58, 0.38, 0.47, 0.28, 0.35, 0.2, 0.3, 0.16, 0.24, 0.1, 0.18, 0.08];
        const travel = (time * 0.16) % 1;
        ctx.beginPath();
        values.forEach((value, index) => {
          const px = plotX + (plotW * index) / (values.length - 1);
          const wave = Math.sin(time * 2.8 + index * 0.82 + variant) * 0.025;
          const py = plotY + plotH * (value + wave);
          if (index === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.lineWidth = 3;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#39d8ab";
        ctx.stroke();

        const markerX = plotX + plotW * travel;
        const markerY = plotY + plotH * (0.53 - travel * 0.4);
        ctx.fillStyle = "rgba(57, 216, 171, 0.16)";
        ctx.beginPath();
        ctx.arc(markerX, markerY, 15 + Math.sin(time * 4) * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#69ebc2";
        ctx.beginPath();
        ctx.arc(markerX, markerY, 4, 0, Math.PI * 2);
        ctx.fill();

        const barCount = 8;
        const gap = 9;
        const barWidth = (plotW - (barCount - 1) * gap) / barCount;
        for (let i = 0; i < barCount; i += 1) {
          const barHeight = 17 + ((i * 17 + variant * 11) % 34) + Math.sin(time * 1.7 + i) * 5;
          const bx = plotX + i * (barWidth + gap);
          const by = y + height - 27 - barHeight;
          roundedRect(bx, by, barWidth, barHeight, 4, i < 4 ? "rgba(50, 151, 221, 0.8)" : "rgba(28, 193, 145, 0.82)");
        }
      }

      function drawMarketFeed(time) {
        const x = 688;
        const y = 176;
        const width = 500;
        const height = 366;
        drawChart(x, y, width, height, time, 1);
        const badges = [
          ["NIFTY", "OI CHANGE", "#113a3b"],
          ["BANKNIFTY", "STRADDLE", "#1a3150"],
          ["SENSEX", "INDEX RISK", "#283050"],
        ];
        badges.forEach(([index, label], i) => {
          const bx = x + i * 164;
          roundedRect(bx, y + height + 17, 152, 72, 12, "rgba(11, 28, 39, 0.92)", "rgba(162, 193, 205, 0.15)");
          text(index, bx + 13, y + height + 43, 11, "#e8f4f7", 700);
          text(label, bx + 13, y + height + 65, 9, i === 0 ? "#57d8ae" : "#91aab6", 700, 0.8);
        });
      }

      function drawAlertStack(time) {
        const x = 733;
        const y = 178;
        const width = 430;
        const cards = [
          { label: "OI CHANGE ALERT", title: "Put-side activity increased", icon: "01", color: "#35d7ac" },
          { label: "MARKET INTEL", title: "Event context for your index", icon: "02", color: "#7fb4ff" },
          { label: "GLOBAL MARKETS", title: "Broader markets, one view", icon: "03", color: "#c5a1ff" },
        ];
        cards.forEach((card, index) => {
          const stagger = Math.max(0, Math.min(1, (time * 1.2 - index * 0.35) % 3));
          const offset = (1 - stagger) * 30;
          const cy = y + index * 112 + offset;
          roundedRect(x, cy, width, 88, 16, "rgba(10, 26, 37, 0.94)", "rgba(162, 193, 205, 0.2)");
          roundedRect(x + 18, cy + 18, 46, 46, 13, "rgba(22, 64, 66, 0.75)");
          text(card.icon, x + 30, cy + 48, 13, card.color, 700);
          text(card.label, x + 82, cy + 34, 9, card.color, 700, 1.05);
          text(card.title, x + 82, cy + 60, 16, "#e8f4f7", 600);
          if (index === 0) {
            roundedRect(x + width - 39, cy + 31, 8, 8, 4, card.color);
          }
        });
      }

      function drawProWorkspace(time) {
        const x = 682;
        const y = 172;
        const width = 516;
        const cards = [
          { label: "YOUR BROKER", title: "Your private Positions", detail: "Connected by you", color: "#45dcaf" },
          { label: "YOUR JOURNAL", title: "Notes saved to your account", detail: "Private to your membership", color: "#8fb9ff" },
          { label: "DESK AI", title: "Market context briefing", detail: "Does not analyze your positions", color: "#c2a3ff" },
        ];
        cards.forEach((card, index) => {
          const slide = Math.min(1, Math.max(0, time * 0.9 - index * 0.32));
          const cy = y + index * 116 + (1 - slide) * 36;
          roundedRect(x, cy, width, 92, 15, "rgba(10, 26, 37, 0.94)", "rgba(162, 193, 205, 0.2)");
          roundedRect(x + 19, cy + 19, 52, 52, 14, "rgba(255,255,255,0.055)");
          ctx.strokeStyle = card.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x + 45, cy + 45, 12 + Math.sin(time * 2 + index) * 1.5, 0, Math.PI * 2);
          ctx.stroke();
          text(card.label, x + 91, cy + 32, 9, card.color, 700, 1);
          text(card.title, x + 91, cy + 56, 16, "#e8f4f7", 700);
          text(card.detail, x + 91, cy + 75, 11, "#9db2be", 500);
        });
      }

      function drawPlanCards(time) {
        const x = 686;
        const y = 204;
        const gap = 12;
        const width = 160;
        const height = 252;
        const plans = [
          { label: "BASIC", detail: "Shared OI desk", color: "#54ddb3", rows: ["OI dashboards", "Strike structure", "Straddle + events"] },
          { label: "PREMIUM", detail: "Personal alerts", color: "#8fb9ff", rows: ["OI change + shift", "Market Intel", "Global Markets"] },
          { label: "PRO", detail: "Your workspace", color: "#c3a2ff", rows: ["Private Positions", "Trade journal", "Desk AI context"] },
        ];
        plans.forEach((plan, index) => {
          const rise = Math.min(1, Math.max(0, time * 0.85 - index * 0.23));
          const cy = y + (1 - rise) * 34;
          roundedRect(x + index * (width + gap), cy, width, height, 16, "rgba(10, 26, 37, 0.95)", "rgba(162, 193, 205, 0.2)");
          roundedRect(x + index * (width + gap) + 15, cy + 16, 34, 4, 2, plan.color);
          text(plan.label, x + index * (width + gap) + 15, cy + 52, 11, plan.color, 700, 0.9);
          text(plan.detail, x + index * (width + gap) + 15, cy + 82, 16, "#ecf4f7", 700);
          plan.rows.forEach((row, rowIndex) => {
            const ry = cy + 124 + rowIndex * 35;
            ctx.fillStyle = plan.color;
            ctx.beginPath();
            ctx.arc(x + index * (width + gap) + 20, ry - 4, 3, 0, Math.PI * 2);
            ctx.fill();
            text(row, x + index * (width + gap) + 30, ry, 10, "#b7c8d0", 500);
          });
        });
        const beamX = x + ((time * 100) % 510);
        ctx.fillStyle = "rgba(63, 227, 181, 0.07)";
        ctx.fillRect(beamX, y - 18, 18, 290);
      }

      function drawScene(sceneIndex, localTime, alpha) {
        const scene = scenes[sceneIndex];
        ctx.save();
        ctx.globalAlpha = alpha;
        text(scene.kicker, 72, 172, 12, "#53dcb3", 700, 1.65);

        const titleY = 250;
        scene.title.forEach((line, index) => {
          const highlighted = index === scene.title.length - 1 && sceneIndex !== 1;
          text(line, 72, titleY + index * 62, 49, highlighted ? "#dff9f0" : "#f2f7f9", 700, -1.2);
        });

        const detailY = titleY + scene.title.length * 62 + 20;
        const words = scene.detail.split(" ");
        let line = "";
        let lineY = detailY;
        ctx.font = "500 18px Arial, sans-serif";
        words.forEach((word) => {
          const next = line ? `${line} ${word}` : word;
          if (ctx.measureText(next).width > 492) {
            text(line, 74, lineY, 18, "#9eb2bd", 500);
            line = word;
            lineY += 29;
          } else {
            line = next;
          }
        });
        if (line) text(line, 74, lineY, 18, "#9eb2bd", 500);

        roundedRect(72, 548, Math.min(532, 35 + scene.badge.length * 7.3), 34, 17, "rgba(13, 35, 45, 0.9)", "rgba(75, 203, 164, 0.32)");
        text(scene.badge, 87, 570, 10, "#c8d7dc", 700, 0.55);

        if (sceneIndex === 0) drawMarketFeed(localTime);
        if (sceneIndex === 1) drawMarketFeed(localTime);
        if (sceneIndex === 2) drawAlertStack(localTime);
        if (sceneIndex === 3) drawProWorkspace(localTime);
        if (sceneIndex === 4) drawPlanCards(localTime);
        ctx.restore();
      }

      function drawFrame(time) {
        drawBackground(time);
        const safeTime = Math.max(0, Math.min(DURATION - 0.001, time));
        const sceneIndex = Math.floor(safeTime / SCENE_LENGTH);
        const localTime = safeTime - sceneIndex * SCENE_LENGTH;
        const edge = 0.42;
        const alpha = Math.min(1, localTime / edge, (SCENE_LENGTH - localTime) / edge);
        drawHeader(sceneIndex, safeTime);
        drawScene(sceneIndex, localTime, Math.max(0, alpha));
      }

      const previewStarted = performance.now();
      function animatePreview(now) {
        drawFrame(((now - previewStarted) / 1000) % DURATION);
        requestAnimationFrame(animatePreview);
      }
      requestAnimationFrame(animatePreview);

      renderButton.addEventListener("click", async () => {
        renderButton.disabled = true;
        status.textContent = "Rendering the original 24-second motion film… keep this tab open.";
        try {
          const poster = await new Promise((resolve, reject) => {
            drawFrame(0.5);
            canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Poster export failed"))), "image/jpeg", 0.88);
          });
          const posterResponse = await fetch("/poster", { method: "POST", body: poster });
          if (!posterResponse.ok) throw new Error("Poster upload failed");

          const frameRate = 30;
          const frameCount = DURATION * frameRate;
          const encoderConfig = {
            codec: "avc1.42001f",
            width: WIDTH,
            height: HEIGHT,
            bitrate: 3200000,
            framerate: frameRate,
            latencyMode: "quality",
            avc: { format: "avc" },
          };
          const support = await VideoEncoder.isConfigSupported(encoderConfig);
          if (!support.supported) throw new Error("This browser cannot encode the H.264 film");

          const muxer = new Mp4Muxer.Muxer({
            target: new Mp4Muxer.ArrayBufferTarget(),
            fastStart: "in-memory",
            firstTimestampBehavior: "offset",
            video: { codec: "avc", width: WIDTH, height: HEIGHT },
          });
          let encodingError = null;
          const encoder = new VideoEncoder({
            output: (chunk, metadata) => muxer.addVideoChunk(chunk, metadata),
            error: (error) => { encodingError = error; },
          });
          encoder.configure(encoderConfig);

          // Explicit frame timestamps make export deterministic and independent of tab refresh throttling.
          for (let frameIndex = 0; frameIndex < frameCount; frameIndex += 1) {
            const timestamp = Math.round((frameIndex * 1_000_000) / frameRate);
            drawFrame(frameIndex / frameRate);
            const frame = new VideoFrame(canvas, {
              timestamp,
              duration: Math.round(1_000_000 / frameRate),
            });
            encoder.encode(frame, { keyFrame: frameIndex % (frameRate * 2) === 0 });
            frame.close();

            if (frameIndex % frameRate === 0) {
              status.textContent = `Encoding H.264 frames… ${Math.floor(frameIndex / frameRate)} / ${DURATION}s`;
            }
            while (encoder.encodeQueueSize > 8 && !encodingError) {
              await new Promise((resolve) => encoder.addEventListener("dequeue", resolve, { once: true }));
            }
            if (encodingError) throw encodingError;
          }

          await encoder.flush();
          encoder.close();
          if (encodingError) throw encodingError;
          muxer.finalize();

          const video = new Blob([muxer.target.buffer], { type: "video/mp4" });
          const videoResponse = await fetch("/video", { method: "POST", body: video });
          if (!videoResponse.ok) throw new Error("Video upload failed");
          const renderedFilm = document.getElementById("rendered-film");
          renderedFilm.src = URL.createObjectURL(video);
          renderedFilm.hidden = false;
          status.textContent = `Rendered ${DURATION}s motion film (${(video.size / 1024 / 1024).toFixed(1)} MB).`;
        } catch (error) {
          status.textContent = `Render failed: ${error.message}`;
        } finally {
          renderButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
